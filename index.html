<div class="wrap">

  <h1>Yu-Gi-Oh! Card Search</h1>
  <p class="sub">ค้นหาการ์ดและดูข้อมูลการ์ด</p>

  <div class="controls">
    <input
      type="text"
      id="searchInput"
      placeholder="ค้นหาชื่อการ์ด..."
    />

    <select id="typeFilter">
      <option value="">ทุกประเภท</option>
      <option value="Monster">Monster</option>
      <option value="Spell">Spell</option>
      <option value="Trap">Trap</option>
    </select>
  </div>

  <!-- ตรงกลาง: ว่างจนกว่าจะเลือก/ค้นหาการ์ด -->
  <section id="cardDetail" class="card-detail hidden">

    <div class="detail-image">
      <div class="detail-frame">
        <img id="detailImage" src="" alt="">
      </div>
    </div>

    <div class="detail-info">
      <h2 id="detailName"></h2>

      <div class="detail-type" id="detailType"></div>

      <div class="detail-stats">
        <span id="detailAttribute"></span>
        <span id="detailLevel"></span>
        <span id="detailAtk"></span>
        <span id="detailDef"></span>
      </div>

      <!-- เผื่อข้อมูลเอฟเฟกต์ -->
      <div class="effect-box">
        <h3>Effect</h3>
        <p id="detailEffect"></p>
      </div>

    </div>

  </section>


  <!-- ด้านล่างแบ่ง 2 ฝั่ง -->
  <div class="card-columns">

    <!-- ซ้าย -->
    <section class="card-section related-section">

      <div class="section-header">
        <h2>การ์ดที่เกี่ยวข้อง</h2>
        <span id="relatedCount"></span>
      </div>

      <div id="relatedGrid" class="card-grid">
        <!-- JS ใส่การ์ดตรงนี้ -->
      </div>

    </section>


    <!-- ขวา -->
    <section class="card-section search-section">

      <div class="section-header">
        <h2>ผลการค้นหา</h2>
        <span id="searchCount"></span>
      </div>

      <div id="searchGrid" class="card-grid">
        <!-- JS ใส่การ์ดตรงนี้ -->
      </div>

    </section>

  </div>

</div>
